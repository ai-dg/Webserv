server {
    listen 8080;
    listen 8090;
    listen 9090;
    host 127.0.0.1;

    server_name Webserv;

    error_page_403 /default/error_pages/403.html
    error_page_404 /default/error_pages/404.html;
    error_page_500 /default/error_pages/500.html;

#   set (K)ilo-bytes (M)ega-bytes
    client_max_body_size 4M;

    keepalive_timeout 65;
    client_body_timeout 60;
    client_header_timeout 10;

    location / {
        root /www/html;
        index index.html;
        methods GET POST;
    }

    location /images/ {
        root /www/images;
        extension .png .jpg .gif .jpeg;
        methods GET;
        autoindex on
    }

    location /upload {
        root /www/uploads;
        methods POST
        upload_store /uploads/
    }

    location /cgi-bin/ {
        root /www/cgi-bin;
        cgi on;
        cgi_bin /cgi-bin/;
        methods GET POST;
        extension .py .pl .sh .php;
    }

    location /old-page {
        return 301 /new-page;
    }
}
