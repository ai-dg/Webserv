server {
    listen 8090;
    host 127.0.0.1;

    server_name myserver.local;

    error_page_404 /error_pages/404.html;
    error_page_500 /error_pages/500.html;

    client_max_body_size 4M;

    location / {
        root /www/html;
        index index.html;
        methods GET POST;
    }

    location /images/ {
        root /www/images;
        autoindex on
    }

    location /upload {
        root /www/uploads;
        methods POST
        upload_store /uploads/
    }

    location /cgi-bin/ {
        root /www/cgi-bin;
        cgi on;
        cgi_bin /cgi-bin/;
        methods GET POST;
        extension .php;
    }

    location /old-page {
        return 301 /new-page;
    }
}
