# Configuration du serveur HTTP

server {
    # temps en seconde avant que le serveur ne ferme la connexion sans nouvelle requette...
    keepalive_timeout 65;
    # temps pour recevoir le body apres avoir reçu les entêtes
    client_body_timeout 60;
    # temps max pour recevoir les entêtes apres avoir ouvert la connexion
    client_header_timeout 10;
    #Le paramètre send_timeout spécifie le temps que que le serveur attend pour envoyer les données au client. 
    #Cela concerne l'intervalle entre deux paquets TCP.
    #Si le client n'accuse pas réception des données dans ce délai, la connexion est interrompue.
    send_timeout 30;

    # Port et hôte pour ce serveur
    listen 8090;
    host 127.0.0.1;

    # Serveur par défaut
    server_name myserver.local;

    # Pages d'erreur par défaut
    error_page 404 /error_pages/404.html;
    error_page 500 /error_pages/500.html;

    # Limitation de la taille du corps du client
    client_max_body_size 4M;

    # Routes
    location / {
        # Répertoire racine pour cette route
        root /www/html;
        index index.html;
        methods GET POST;
    }

    location /images/ {
        # Répertoire pour les fichiers d'images
        root /www/images;
        autoindex on; # Activer le listing des répertoires
    }

    location /upload {
        # Répertoire pour les uploads
        root /www/uploads;
        methods POST; # Seules les méthodes POST sont acceptées
        upload_store /uploads/; # Répertoire où les fichiers seront sauvegardés
    }

    location /cgi-bin/ {
        # Exécuter les scripts CGI
        cgi on;
        cgi_bin /cgi-bin/;
        methods GET POST;
        extension .php;
    }

    # Redirection HTTP
    location /old-page {
        return 301 /new-page;
    }
}
